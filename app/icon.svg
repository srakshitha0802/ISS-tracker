<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#020617"/>
  <rect x="2" y="2" width="60" height="60" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Corner Tech Accent Brackets -->
  <line x1="2" y1="8" x2="8" y2="2" stroke="#22d3ee" stroke-width="2"/>
  <line x1="62" y1="8" x2="56" y2="2" stroke="#22d3ee" stroke-width="2"/>
  <line x1="2" y1="56" x2="8" y2="62" stroke="#22d3ee" stroke-width="2"/>
  <line x1="62" y1="56" x2="56" y2="62" stroke="#22d3ee" stroke-width="2"/>

  <!-- Orbital Trajectory Ring -->
  <ellipse cx="32" cy="32" rx="27" ry="11" transform="rotate(-26 32 32)" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="3 3"/>

  <!-- Main Integrated Truss Structure -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#e2e8f0" stroke-width="2.6"/>

  <!-- Port Solar Arrays -->
  <line x1="14" y1="12" x2="14" y2="52" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="8" y="14" width="12" height="15" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <line x1="8" y1="21.5" x2="20" y2="21.5" stroke="#0ea5e9" stroke-width="0.8"/>
  <rect x="8" y="35" width="12" height="15" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <line x1="8" y1="42.5" x2="20" y2="42.5" stroke="#0ea5e9" stroke-width="0.8"/>

  <!-- Starboard Solar Arrays -->
  <line x1="50" y1="12" x2="50" y2="52" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="44" y="14" width="12" height="15" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <line x1="44" y1="21.5" x2="56" y2="21.5" stroke="#0ea5e9" stroke-width="0.8"/>
  <rect x="44" y="35" width="12" height="15" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
  <line x1="44" y1="42.5" x2="56" y2="42.5" stroke="#0ea5e9" stroke-width="0.8"/>

  <!-- Pressurized Habitat & Science Modules -->
  <rect x="27" y="20" width="10" height="24" fill="#0f172a" stroke="#22d3ee" stroke-width="1.8"/>
  <line x1="27" y1="28" x2="37" y2="28" stroke="#06b6d4" stroke-width="1.2"/>
  <line x1="27" y1="36" x2="37" y2="36" stroke="#06b6d4" stroke-width="1.2"/>
  <rect x="22" y="28" width="20" height="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8"/>

  <!-- Telemetry Beacon Point -->
  <circle cx="32" cy="18" r="2" fill="#22d3ee"/>
